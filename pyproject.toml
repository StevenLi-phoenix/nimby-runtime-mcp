[project]
name = "nimby-runtime-mcp"
version = "0.1.0"
description = "Experimental runtime bridge investigation for NIMBY Rails"
requires-python = ">=3.11"
dependencies = [
    "frida>=17,<18",
    "pefile>=2024.8.26",
    "capstone>=5,<6",
    "mcp>=1.26,<2",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
